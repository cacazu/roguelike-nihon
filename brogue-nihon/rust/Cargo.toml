[package]
name = "brogue-browser-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roguelike-common = { path = "../../rust-common" }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = [
  "Window", "Document", "Element", "Node", "HtmlElement", "HtmlCanvasElement",
  "HtmlInputElement", "HtmlSelectElement", "CanvasRenderingContext2d", "ImageData",
  "Event", "EventTarget", "KeyboardEvent", "PointerEvent", "DomRect",
  "Response", "Location", "UrlSearchParams", "Storage", "CssStyleDeclaration", "console"
] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
