[package]
name = "roguelike-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]
resolver = "3"

[dependencies]
serde_json = "=1.0.151"
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std"] }
swash = "=0.2.10"
png = "=0.18.1"
svgtypes = "=0.16.1"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
